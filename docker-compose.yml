# Local development stack with PostgreSQL. Not hardened for production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loyalloop
      POSTGRES_USER: loyalloop
      POSTGRES_PASSWORD: loyalloop-dev-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalloop"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      SECRET_KEY: dev-only-change-me
      DATABASE_URL: postgresql+psycopg2://loyalloop:loyalloop-dev-only@db:5432/loyalloop
      PUBLIC_BASE_URL: http://localhost:8000
      DEMO_MODE: "true"
    ports:
      - "8000:8000"

  # Delivers queued emails. Set EMAIL_PROVIDER=smtp and SMTP_* to send real mail.
  worker:
    build: .
    command: ["flask", "email-worker", "--interval", "10"]
    depends_on:
      app:
        condition: service_started
    environment:
      APP_ENV: development
      SECRET_KEY: dev-only-change-me
      DATABASE_URL: postgresql+psycopg2://loyalloop:loyalloop-dev-only@db:5432/loyalloop
      PUBLIC_BASE_URL: http://localhost:8000
      DEMO_MODE: "true"
      EMAIL_PROVIDER: console

volumes:
  pgdata:
