name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-24.04  # pinned: tool support (e.g. Playwright) lags new runner images
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loyalloop
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: loyalloop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loyalloop" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      FLASK_APP: wsgi.py
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg2://loyalloop:ci-only-password@localhost:5432/loyalloop_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check app tests scripts --line-length 120
      - name: Tests
        run: python -m pytest -q
      - name: Migrations apply cleanly and match models
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg2://loyalloop:ci-only-password@localhost:5432/loyalloop_test
          DEMO_MODE: "true"
        run: |
          flask db upgrade
          flask db check
          flask db downgrade base
          flask db upgrade
          flask seed-demo
          flask seed-demo --reset
          flask reconcile

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04  # pinned: tool support (e.g. Playwright) lags new runner images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python (pip-audit)
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r backend/requirements.txt
      - name: npm (all dependencies, high and above)
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04  # pinned: tool support (e.g. Playwright) lags new runner images
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (PostgreSQL + Chromium)
    runs-on: ubuntu-24.04  # pinned: tool support (e.g. Playwright) lags new runner images
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loyalloop
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: loyalloop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loyalloop" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLASK_APP: wsgi.py
      DATABASE_URL: postgresql+psycopg2://loyalloop:ci-only-password@localhost:5432/loyalloop
      DEMO_MODE: "true"
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start server
        working-directory: backend
        run: |
          flask db upgrade
          flask seed-demo
          nohup flask run --port 5000 > ../server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/api/v1/health && break; sleep 1; done
      - run: python backend/scripts/smoke_e2e.py http://127.0.0.1:5000
      - run: npx playwright test
        working-directory: frontend
      - run: flask reconcile
        working-directory: backend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            server.log
            frontend/test-results/

  docker:
    name: Docker image + compose smoke test
    runs-on: ubuntu-24.04  # pinned: tool support (e.g. Playwright) lags new runner images
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and start stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
      - name: Smoke test against container
        run: python backend/scripts/smoke_e2e.py http://127.0.0.1:8000
      - name: Email worker is running
        run: docker compose ps worker --status running | grep -q worker
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
